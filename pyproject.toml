[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sssd-smartcard"
version = "0.3.1"
description = "Generate, validate and deploy SSSD Smart Card / PIV certificate authentication configuration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "cryptography>=41.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sssd-smartcard = "sssd_smartcard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sssd_smartcard = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
